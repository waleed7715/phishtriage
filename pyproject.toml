[project]
name = "phishtriage"
version = "0.1.0"
description = "production-grade phishing triage for .eml files on the Claude API"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Waleed Hussain", email = "ID+waleed7715@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.14.2",
]

[project.scripts]
phishtriage = "phishtriage:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W/F basics, I imports, B bugbear, UP pyupgrade, S bandit security rules,
# SIM simplify, PT pytest style, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --strict-markers --cov=phishtriage --cov-report=term-missing"
markers = ["live: calls real external APIs; run manually only"]
